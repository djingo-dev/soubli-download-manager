<!doctype html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <title>soubli Drop Zone</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="refinements.css">
    <link rel="stylesheet" href="drop.css">
</head>

<body>
    <button id="close" aria-label="Close" title="Close">×</button>
    <div id="drop-target">
        <div class="drop-icon-wrap">
            <img src="logo.svg" width="36" height="36" alt="soubli">
            <span class="drop-pulse"></span>
        </div>
        <strong>Drop a link here</strong>
        <small id="drop-status">Drop any URL or Magnet to download</small>
        <div id="drop-stats" class="drop-stats-badge">
            <span id="drop-active-count">0 active</span>
            <span id="drop-speed">0 B/s</span>
        </div>
    </div>
    <script src="appearance.js"></script>
    <script src="workspace-appearance.js"></script>
    <script src="drop.js"></script>
</body>

</html>
